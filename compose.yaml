networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  vpn-client:
    build: .
    image: softether-vpn-client:latest
    container_name: softether-vpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      vpn-net:
        ipv4_address: 172.30.0.10
    ports:
      - "8888:8888"
      - "1080:1080"
    environment:
      SE_HOST: ${SE_HOST:-}
      SE_PORT: ${SE_PORT:-443}
      SE_HUB: ${SE_HUB:-}
      SE_USER: ${SE_USER:-}
      SE_PASSWORD: ${SE_PASSWORD:-}
    volumes:
      - vpnconfig:/vpnclient
      - ./client-softether.vpn:/client-softether.vpn:ro
    restart: unless-stopped

volumes:
  vpnconfig:
