services:
  vpn-client:
    build: .
    image: softether-vpn-client:latest
    container_name: softether-vpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "127.0.0.1:1080:1080"
    environment:
      SE_HOST: ${SE_HOST:-}
      SE_PORT: ${SE_PORT:-443}
      SE_HUB: ${SE_HUB:-}
      SE_USER: ${SE_USER:-}
      SE_PASSWORD: ${SE_PASSWORD:-}
      VPN_PROFILE: ${VPN_PROFILE:-}
    volumes:
      - vpnconfig:/vpnclient
      - ./vpn-profiles:/vpn-profiles:ro
    restart: unless-stopped

volumes:
  vpnconfig:
